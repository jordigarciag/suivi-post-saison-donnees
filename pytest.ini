# On indique à pytest où chercher les tests et les modules locaux. Les scripts de tests navigateur
# ne sont pas collectés par ce testpaths et se lancent séparément.
[pytest]
# On limite la collecte habituelle au dossier tests ; les tests navigateur se lancent séparément.
testpaths = tests
# On rend ces dossiers locaux importables dans les tests, sans installer une autre copie du projet.
pythonpath = src app scripts tests tests/unit
# On collecte seulement les fichiers dont le nom correspond à ce motif.
python_files = test_*.py
# On reconnaît les fonctions de test par ce préfixe.
python_functions = test_*
# On ajoute ces options aux lancements pytest ; -v rend les noms des tests visibles.
addopts = -v
